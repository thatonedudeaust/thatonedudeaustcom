  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0b; --bg2: #111113; --bg3: #18181c;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
      --text: #f0ede8; --text-muted: #6b6b72; --text-mid: #9a9aa3;
      --accent: #c8f04a;
      --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");

    .nav-back:hover { color: var(--accent); }
    main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 4rem 3rem; }
    .page-eyebrow { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; animation: fadeUp 0.5s ease forwards; }
    h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.75rem; animation: fadeUp 0.5s ease forwards 0.1s; opacity: 0; }
    .page-desc { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.7; animation: fadeUp 0.5s ease forwards 0.2s; opacity: 0; }

    .disclaimer {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
      background: var(--bg2); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 4px; padding: 0.75rem 1rem; margin-bottom: 2rem;
    }

    .headlines-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
      background: var(--border); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
      animation: fadeUp 0.5s ease forwards 0.3s; opacity: 0;
    }

    .headline-card {
      background: var(--bg2); padding: 1.75rem;
      cursor: pointer; transition: background 0.2s;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .headline-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent);
      transform: scaleY(0); transition: transform 0.2s; transform-origin: bottom;
    }
    .headline-card:hover { background: var(--bg3); }
    .headline-card:hover::before { transform: scaleY(1); }
    .headline-category { font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
    .headline-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; color: var(--text); }
    .headline-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); display: flex; gap: 1rem; }

    /* ARTICLE VIEW */
    #article-view { display: none; }
    #article-view.visible { display: block; animation: fadeUp 0.4s ease forwards; }
    .article-back {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted);
      cursor: pointer; margin-bottom: 2rem; display: inline-flex;
      align-items: center; gap: 0.5rem; transition: color 0.2s; background: none; border: none;
    }
    .article-back:hover { color: var(--accent); }
    .article-category { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1rem; }
    .article-title { font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .article-meta {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);
      display: flex; gap: 1.5rem; margin-bottom: 2rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .article-body { font-size: 1rem; line-height: 1.85; color: var(--text-mid); max-width: 680px; }
    .article-body p { margin-bottom: 1.25rem; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) { nav { padding: 1rem 1.5rem; } main { padding: 2rem 1.5rem; } .headlines-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav>

<main>

  <div id="headlines-view">

    <div class="headlines-grid" id="headlines-grid"></div>
  </div>

  <div id="article-view">
    <button class="article-back" onclick="showHeadlines()">← Back to articles</button>
    <div id="article-content"></div>
  </div>
</main>

<script>

function showHeadlines() {
  document.getElementById('article-view').classList.remove('visible');
  document.getElementById('headlines-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function showArticle(idx) {
  var a = ARTICLES[idx];
  document.getElementById('headlines-view').style.display = 'none';
  var view = document.getElementById('article-view');
  view.classList.add('visible');
  document.getElementById('article-content').innerHTML =
    '<div class="article-category">' + a.category + '</div>' +
    '<div class="article-title">' + a.title + '</div>' +
    '<div class="article-meta"><span>' + a.author + '</span><span>' + a.time + '</span><span>' + a.read + '</span></div>' +
    '<div class="article-body">' + a.body.map(function(p) { return '<p>' + p + '</p>'; }).join('') + '</div>';
  window.scrollTo(0, 0);
}

// Build headlines grid
var grid = document.getElementById('headlines-grid');
grid.innerHTML = ARTICLES.map(function(a, i) {
  return '<div class="headline-card" onclick="showArticle(' + i + ')">' +
    '<div class="headline-category">' + a.category + '</div>' +
    '<div class="headline-title">' + a.title + '</div>' +
    '<div class="headline-meta"><span>' + a.time + '</span><span>' + a.read + '</span></div>' +
  '</div>';
}).join('');
