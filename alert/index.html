<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPAWS — Emergency Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #b22222;
      --red-dark: #8b0000;
      --red-light: #fdf0f0;
      --blue: #003366;
      --blue-light: #f0f4ff;
      --gray: #f5f5f5;
      --border: #cccccc;
      --text: #1a1a1a;
      --text-muted: #555555;
    }

    body {
      background: var(--gray);
      color: var(--text);
      font-family: 'Source Sans 3', Arial, sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    /* TOP BANNER */
    .top-banner {
      background: var(--blue);
      color: white;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .top-banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gov-seal {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .top-banner-site {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .top-banner-right {
      font-size: 11px;
      color: #aabbdd;
    }

    /* HEADER */
    .site-header {
      background: white;
      border-bottom: 3px solid var(--red);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo-text {
      display: flex;
      flex-direction: column;
    }

    .header-agency {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ALERT BANNER */
    .alert-banner {
      background: var(--red);
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .alert-banner-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      animation: pulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* MAIN */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ALERT CARD */
    .alert-card {
      background: white;
      border: 1px solid var(--border);
      border-left: 6px solid var(--red);
      border-radius: 2px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .alert-card-header {
      background: var(--red-light);
      padding: 14px 20px;
      border-bottom: 1px solid #f0cccc;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .alert-event-code {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      background: var(--red);
      color: white;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      display: inline-block;
    }

    .alert-event-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--red-dark);
      font-family: 'Source Serif 4', Georgia, serif;
      line-height: 1.2;
    }

    .alert-status-badge {
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 2px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .alert-card-meta {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background: #fafafa;
    }

    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; }
    .meta-value { font-size: 13px; font-weight: 600; color: var(--text); }

    .alert-card-body { padding: 20px; }

    .alert-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .alert-section-title:first-child { margin-top: 0; }

    .alert-message {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      background: var(--red-light);
      border-left: 3px solid var(--red);
      padding: 12px 16px;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .alert-areas {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .area-tag {
      background: var(--blue-light);
      border: 1px solid #aabbdd;
      color: var(--blue);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 2px;
      font-weight: 600;
    }

    .instructions-box {
      background: #fff8e6;
      border: 1px solid #e6c87a;
      border-left: 3px solid #cc9900;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    .instructions-box ul { padding-left: 20px; margin-top: 6px; }
    .instructions-box ul li { margin-bottom: 4px; }

    /* SAME HEADER BOX */
    .same-box {
      background: #1a1a1a;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 2px;
      word-break: break-all;
      line-height: 1.6;
    }

    /* SIDEBAR */
    .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }

    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    .sidebar-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .sidebar-card-header {
      background: var(--blue);
      color: white;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sidebar-card-body { padding: 12px 14px; font-size: 13px; line-height: 1.7; }
    .sidebar-card-body a { color: var(--blue); }

    .sidebar-stat { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    .sidebar-stat:last-child { border-bottom: none; }
    .sidebar-stat-label { color: var(--text-muted); }
    .sidebar-stat-value { font-weight: 700; color: var(--text); }

    /* TICKER */
    .ticker {
      background: var(--blue);
      color: white;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .ticker-inner { display: inline-block; animation: ticker 30s linear infinite; }
    @keyframes ticker { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

    /* FOOTER */
    .site-footer {
      background: var(--blue);
      color: #aabbdd;
      padding: 20px;
      font-size: 11px;
      margin-top: 30px;
      text-align: center;
      line-height: 1.8;
    }

    .site-footer a { color: #88aadd; }

    /* RANDOM ALERT SELECTOR */
    .alert-nav {
      background: white;
      border: 1px solid var(--border);
      padding: 10px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      border-radius: 2px;
    }

    .alert-nav button {
      background: var(--blue);
      color: white;
      border: none;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
      font-weight: 600;
    }

    .alert-nav button:hover { background: #004488; }

    /* DISCLAIMER */
  #disclaimer-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }

  .disclaimer-box {
    background: white; max-width: 560px; width: 100%;
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .disclaimer-header {
    background: #b22222; color: white;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 12px;
  }

  .disclaimer-header-icon { font-size: 1.5rem; flex-shrink: 0; }

  .disclaimer-header-text h2 {
    font-size: 16px; font-weight: 700; margin-bottom: 2px;
    font-family: 'Source Sans 3', Arial, sans-serif;
  }

  .disclaimer-header-text p {
    font-size: 12px; opacity: 0.85;
    font-family: 'Source Sans 3', Arial, sans-serif;
  }

  .disclaimer-body {
    padding: 24px;
    font-family: 'Source Sans 3', Arial, sans-serif;
    font-size: 14px; line-height: 1.7; color: #1a1a1a;
  }

  .disclaimer-body p { margin-bottom: 12px; }
  .disclaimer-body p:last-of-type { margin-bottom: 20px; }

  .disclaimer-btn {
    width: 100%; padding: 12px;
    background: #003366; color: white;
    border: none; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.05em;
    font-family: 'Source Sans 3', Arial, sans-serif;
    transition: background 0.2s;
  }

  .disclaimer-btn:hover { background: #004488; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</head>

  return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' EDT';
}

function formatDateTime(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
    date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + ' EDT';
}

function renderAlert(idx) {
  var a = ALERTS[idx];
  var now = new Date();

  document.getElementById('alert-code').textContent = a.code;
  document.getElementById('alert-title').textContent = a.title;
  document.getElementById('meta-issuer').textContent = a.issuer;
  document.getElementById('meta-issued').textContent = formatDateTime(now);
  document.getElementById('meta-expires').textContent = a.expires + ' from issue';
  document.getElementById('alert-message').textContent = a.message;
  document.getElementById('alert-instructions').innerHTML = a.instructions;
  document.getElementById('alert-same').textContent = a.same;
  document.getElementById('sb-type').textContent = a.type;
  document.getElementById('sb-severity').textContent = a.severity;
  document.getElementById('sb-urgency').textContent = a.urgency;
  document.getElementById('sb-certainty').textContent = a.certainty;
  document.getElementById('sb-category').textContent = a.category;
  document.getElementById('sb-originator').textContent = a.originator;
  document.getElementById('sb-updated').textContent = formatTime(now);
  document.getElementById('alert-num-label').textContent = (idx + 1) + ' of ' + ALERTS.length;
  document.getElementById('banner-text').textContent = 'ACTIVE ' + a.title.toUpperCase() + ' — IMMEDIATE ACTION REQUIRED';
  document.getElementById('ticker-text').textContent =
    '⚠ ACTIVE ALERT: ' + a.title + ' ⚠ Issued by: ' + a.issuer + ' ⚠ Affected: ' + a.areas.join(', ') +
    ' ⚠ Call 911 for life-threatening emergencies ⚠ Monitor local EAS stations for updates ⚠ ' +
    'ACTIVE ALERT: ' + a.title + ' ⚠ ';

  var areasEl = document.getElementById('alert-areas');
  areasEl.innerHTML = a.areas.map(function(area) {
    return '<span class="area-tag">' + area + '</span>';
  }).join('');
}

function nextAlert() {
  currentAlertIdx = (currentAlertIdx + 1) % ALERTS.length;
  renderAlert(currentAlertIdx);
}

function prevAlert() {
  currentAlertIdx = (currentAlertIdx - 1 + ALERTS.length) % ALERTS.length;
  renderAlert(currentAlertIdx);
}

function randomAlert() {
  var idx;
  do { idx = Math.floor(Math.random() * ALERTS.length); } while (idx === currentAlertIdx && ALERTS.length > 1);
  currentAlertIdx = idx;
  renderAlert(currentAlertIdx);
}

// Clock
function updateClock() {
  document.getElementById('current-time').textContent = new Date().toUTCString();
}

setInterval(updateClock, 1000);
updateClock();
renderAlert(0);
</script>
