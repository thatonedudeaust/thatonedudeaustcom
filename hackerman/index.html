<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='18' fill='%2300ff41' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    #terminal {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: #00aa2a transparent;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-thumb { background: #00aa2a; }

    .line { margin-bottom: 0; word-break: break-word; white-space: pre-wrap; }
    .cmd    { color: #00ff41; }
    .out    { color: #00aa2a; }
    .err    { color: #ff4444; }
    .bright { color: #00ff41; font-weight: bold; }
    .dim    { color: #005514; }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-shrink: 0;
    }

    .prompt { color: #00ff41; white-space: nowrap; user-select: none; }

    #input {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      flex: 1;
      caret-color: #00ff41;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    #terminal { text-shadow: 0 0 8px rgba(0,255,65,0.35); }
  </style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div class="prompt-row">
    <span class="prompt">aust@thatonedudeaust.com:~$</span>
    <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>

<script>
var output = document.getElementById('output');
var input = document.getElementById('input');
var cmdHistory = [];
var historyIdx = -1;

var BOOT = [
  '  thatonedudeaust.com terminal v1.0.0',
  '  type "help" for available commands',
  '',
];

function print(text, cls) {
  var div = document.createElement('div');
  div.className = 'line ' + (cls || 'out');
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function printBlank() { print('', 'out'); }

function printCmd(cmd) {
  print('aust@thatonedudeaust.com:~$ ' + cmd, 'cmd');
}

var COMMANDS = {
  help: function() {
    print('  AVAILABLE COMMANDS', 'bright');
    print('  ----------------------------------------', 'dim');
    var cmds = [
      ['about',         'who is aust'],
      ['projects',      'current projects'],
      ['eas',           'EAS encoder info'],
      ['weather',       'weather & NWS info'],
      ['skills',        'tech skills'],
      ['links',         'social links'],
      ['ls',            'list site pages'],
      ['whoami',        'you, apparently'],
      ['date',          'current date & time'],
      ['uptime',        'how long the site has been up'],
      ['ping',          'ping the site'],
      ['changelog',     'view site changelog'],
      ['clear',         'clear the terminal'],
      ['matrix',        'do you feel it'],
      ['hack',          'i am in'],
      ['sudo rm -rf /', 'don\'t'],
      ['coffee',        'important'],
      ['coinflip',      'fate decider'],
      ['roll [sides]',  'roll a die'],
      ['rickroll',      'you will regret this'],
      ['screams',       'into the void'],
      ['uwu',           '...'],
      ['exit',          'you can\'t leave'],
    ];
    cmds.forEach(function(c) {
      var padded = ('  ' + c[0]).padEnd(22, ' ');
      print(padded + '— ' + c[1], 'out');
    });
    printBlank();
  },

  about: function() {
    print('  ABOUT AUST', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  Developer from New Jersey.', 'out');
    print('  Lead Developer at RAGE Alerting Systems.', 'out');
    print('  Builds web apps, Roblox experiences,', 'out');
    print('  and EAS simulation tools.', 'out');
    print('  Deep interest in weather radio,', 'out');
    print('  emergency alerting systems, and electronics.', 'out');
    printBlank();
  },

  projects: function() {
    print('  PROJECTS', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  [1] RAGE Alerting Systems', 'out');
    print('      Lead Developer — Roblox EAS simulation', 'out');
    print('', 'out');
    print('  [2] NOAA Weather Radio Web App', 'out');
    print('      Live NWS data + DECtalk TTS', 'out');
    print('      thatonedudeaust.github.io/weather-radio', 'out');
    print('', 'out');
    print('  [3] EAS Encoder / Decoder', 'out');
    print('      Real FSK SAME encoding per 47 CFR 11.31', 'out');
    print('      thatonedudeaust.com/eas', 'out');
    print('      thatonedudeaust.com/decoder', 'out');
    printBlank();
  },

  eas: function() {
    print('  EMERGENCY ALERT SYSTEM', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  Standard:    47 CFR 11.31', 'out');
    print('  Baud rate:   520.83 bps', 'out');
    print('  Mark freq:   2083.3 Hz', 'out');
    print('  Space freq:  1562.5 Hz', 'out');
    print('  Preamble:    0xAB x 16', 'out');
    print('  Attn tone:   853 Hz + 960 Hz', 'out');
    print('  EOM:         NNNN x 3', 'out');
    print('', 'out');
    print('  Try it: thatonedudeaust.com/eas', 'out');
    print('  Decode: thatonedudeaust.com/decoder', 'out');
    printBlank();
  },

  weather: function() {
    print('  WEATHER & NWS', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  NWS Office:    Mount Holly, NJ', 'out');
    print('  Station ID:    KIH28', 'out');
    print('  Frequency:     162.550 MHz', 'out');
    print('  Coverage:      South Jersey', 'out');
    print('  Counties:      Burlington, Camden, Gloucester,', 'out');
    print('                 Atlantic, Cumberland, Salem, Cape May', 'out');
    print('', 'out');
    print('  Weather radio app:', 'out');
    print('  thatonedudeaust.github.io/weather-radio', 'out');
    printBlank();
  },

  skills: function() {
    print('  SKILLS', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  HTML / CSS / JS    ||||||||||||  100%', 'out');
    print('  Roblox / Luau      ||||||||||    85%', 'out');
    print('  EAS / SAME         ||||||||||||  100%', 'out');
    print('  Web Audio API      |||||||||     75%', 'out');
    print('  NWS API            ||||||||||||  100%', 'out');
    print('  Supabase           ||||||||      70%', 'out');
    print('  Being cool         ||||||||||||  100%', 'out');
    printBlank();
  },

  links: function() {
    print('  LINKS', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  GitHub   github.com/thatonedudeaust', 'out');
    print('  X        x.com/thatonedudeaust', 'out');
    print('  Roblox   roblox.com (search: thatonedudeaust)', 'out');
    print('  eBay     ebay.com/usr/thatonedudeaust', 'out');
    print('  Site     thatonedudeaust.com', 'out');
    printBlank();
  },

  ls: function() {
    print('  SITE PAGES', 'bright');
    print('  ----------------------------------------', 'dim');
    print('  /              /login         /admin', 'out');
    print('  /changelog     /request       /eas', 'out');
    print('  /decoder       /typingtest    /info', 'out');
    print('  /qr            /excuse        /dice', 'out');
    print('  /hackerman     /404', 'out');
    printBlank();
  },

  whoami: function() {
    print('  a visitor.', 'out');
    print('  or maybe a hacker.', 'out');
    print('  hard to say really.', 'out');
    printBlank();
  },

  date: function() {
    var now = new Date();
    print('  UTC:   ' + now.toUTCString(), 'out');
    print('  Local: ' + now.toLocaleString(), 'out');
    printBlank();
  },

  uptime: function() {
    var launch = new Date('2026-01-01');
    var now = new Date();
    var diff = Math.floor((now - launch) / 1000);
    var days = Math.floor(diff / 86400);
    var hours = Math.floor((diff % 86400) / 3600);
    var mins = Math.floor((diff % 3600) / 60);
    print('  thatonedudeaust.com uptime:', 'out');
    print('  ' + days + ' days, ' + hours + ' hours, ' + mins + ' minutes', 'bright');
    printBlank();
  },

  ping: function() {
    print('  PING thatonedudeaust.com', 'out');
    print('  64 bytes: time=1.2ms', 'out');
    print('  64 bytes: time=0.9ms', 'out');
    print('  64 bytes: time=1.1ms', 'out');
    print('  3 packets transmitted, 3 received, 0% packet loss', 'out');
    printBlank();
  },

  changelog: function() {
    print('  Redirecting...', 'out');
    print('  thatonedudeaust.com/changelog', 'out');
    printBlank();
  },

  hack: function() {
    print('  initiating hack sequence...', 'out');
    print('  [######----------] 35%  accessing mainframe', 'out');
    print('  [############----] 75%  bypassing firewall', 'out');
    print('  [################] 100% done', 'out');
    print("  I'M IN.", 'bright');
    print('  (you are literally just on a website)', 'out');
    printBlank();
  },

  matrix: function() {
    print('  Wake up, Neo...', 'bright');
    print('  The Matrix has you.', 'out');
    print('  Follow the white rabbit.', 'out');
    print('  ...', 'dim');
    print('  (this is just a terminal on a personal site lol)', 'dim');
    printBlank();
  },

  coffee: function() {
    print('       ( (', 'out');
    print('        ) )', 'out');
    print('     ........', 'out');
    print('     |      |]', 'out');
    print('     \\      /', 'out');
    print("      `----'", 'out');
    print('', 'out');
    print('  Coffee status: essential', 'out');
    printBlank();
  },

  coinflip: function() {
    var result = Math.random() < 0.5 ? 'HEADS' : 'TAILS';
    print('  flipping coin...', 'out');
    print('  ' + result, 'bright');
    printBlank();
  },

  rickroll: function() {
    print('  loading secret content...', 'out');
    print('', 'out');
    print('  Never gonna give you up,', 'bright');
    print('  Never gonna let you down,', 'bright');
    print('  Never gonna run around and desert you.', 'bright');
    print('', 'out');
    print('  you played yourself.', 'out');
    printBlank();
  },

  screams: function() {
    print('  AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA', 'bright');
    print('  AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA', 'bright');
    print('  AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA', 'bright');
    print('  ...', 'out');
    print('  ok. better.', 'out');
    printBlank();
  },

  uwu: function() {
    print('  no.', 'out');
    printBlank();
  },

  exit: function() {
    print('  there is no escape.', 'out');
    print('  you live here now.', 'out');
    printBlank();
  },

  'sudo': function(args) {
    if (args.join(' ') === 'rm -rf /') {
      print('  uh oh.', 'err');
      print('  deleting everything...', 'err');
      print("  just kidding. you don't have sudo.", 'err');
      print('  nice try though.', 'out');
      printBlank();
    } else {
      print('  sudo: permission denied', 'err');
      printBlank();
    }
  },

  clear: function() {
    output.innerHTML = '';
  },
};

function handleCommand(raw) {
  var trimmed = raw.trim();
  if (!trimmed) return;

  cmdHistory.unshift(trimmed);
  historyIdx = -1;
  printCmd(trimmed);

  var parts = trimmed.split(' ');
  var cmd = parts[0].toLowerCase();
  var args = parts.slice(1);

  if (cmd === 'roll') {
    var sides = parseInt(args[0]) || 6;
    if (sides < 2 || sides > 10000) {
      print('  Invalid die.', 'err');
    } else {
      var result = Math.floor(Math.random() * sides) + 1;
      print('  Rolling D' + sides + '...', 'out');
      print('  Result: ' + result, 'bright');
    }
    printBlank();
    return;
  }

  if (cmd === 'sudo') {
    COMMANDS['sudo'](args);
    return;
  }

  if (COMMANDS[cmd]) {
    COMMANDS[cmd](args);
  } else {
    print('  command not found: ' + cmd, 'err');
    print('  type "help" to see available commands', 'out');
    printBlank();
  }
}

// Boot
BOOT.forEach(function(line) {
  var div = document.createElement('div');
  div.className = 'line bright';
  div.textContent = line;
  output.appendChild(div);
});

// Input
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var val = input.value;
    input.value = '';
    handleCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < cmdHistory.length - 1) {
      historyIdx++;
      input.value = cmdHistory[historyIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      input.value = cmdHistory[historyIdx];
    } else {
      historyIdx = -1;
      input.value = '';
    }
  }
});

document.addEventListener('click', function() { input.focus(); });
input.focus();
</script>
</body>
</html>
