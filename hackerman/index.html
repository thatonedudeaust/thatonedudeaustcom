<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='18' fill='%2300ff41' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff41;
      --green-dim: #00aa2a;
      --green-dark: #003b0f;
      --bg: #0a0a0a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    #terminal {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--green-dim) transparent;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-thumb { background: var(--green-dim); }

    .line { margin-bottom: 0.1rem; word-break: break-word; white-space: pre-wrap; }
    .line.cmd { color: var(--green); }
    .line.out { color: var(--green-dim); }
    .line.err { color: #ff4444; }
    .line.accent { color: var(--green); font-weight: bold; }
    .line.dim { color: #006614; }
    .line.blank { min-height: 1rem; }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-shrink: 0;
    }

    .prompt { color: var(--green); white-space: nowrap; user-select: none; }

    #input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      flex: 1;
      caret-color: var(--green);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* Glow */
    #terminal { text-shadow: 0 0 8px rgba(0,255,65,0.4); }

    .ascii { color: var(--green); line-height: 1.2; }
  </style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div class="prompt-row">
    <span class="prompt">aust@thatonedudeaust.com:~$</span>
    <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>

  changelog: function() {
    return [

      ['out',    '  → thatonedudeaust.com/changelog'],

  ls: function() {
    return [

      ['dim',    '  ─────────────────────────────────────'],
      ['out',    '  /              /login         /admin'],
      ['out',    '  /changelog     /request       /eas'],

  whoami: function() {

  date: function() {
    var now = new Date();
    return [

  uptime: function() {
    var launch = new Date('2026-01-01');
    var now = new Date();
    var diff = Math.floor((now - launch) / 1000);
    var days = Math.floor(diff / 86400);
    var hours = Math.floor((diff % 86400) / 3600);
    var mins = Math.floor((diff % 3600) / 60);
    return [
      ['out',    '  thatonedudeaust.com has been live for:'],
      ['accent', '  ' + days + ' days, ' + hours + ' hours, ' + mins + ' minutes'],
      ['blank',  ''],
    ];

  ping: function() {

      ['out',    '  64 bytes from thatonedudeaust.com: time=0.9ms'],
      ['out',    '  64 bytes from thatonedudeaust.com: time=1.1ms'],

      ['out',    '  accessing mainframe...'],

  'sudo rm -rf /': function() {

  clear: function() {

// Special roll command
function handleRoll(args) {
  var sides = parseInt(args[0]) || 6;
  if (sides < 2 || sides > 1000) return [['err', '  Invalid die. Use a number between 2 and 1000.'], ['blank', '']];
  var result = Math.floor(Math.random() * sides) + 1;
  return [
    ['out',    '  Rolling D' + sides + '...'],
    ['accent', '  Result: ' + result],
    ['blank',  ''],
  ];
}

function print(lines) {
  lines.forEach(function(line) {
    var div = document.createElement('div');
    div.className = 'line ' + (line[0] || 'out');
    div.textContent = line[1] || '';
    output.appendChild(div);
  });
  output.scrollTop = output.scrollHeight;
}

function printInput(cmd) {
  var div = document.createElement('div');
  div.className = 'line cmd';
  div.textContent = 'aust@thatonedudeaust.com:~$ ' + cmd;
  output.appendChild(div);
}

function handleCommand(raw) {
  var trimmed = raw.trim();
  if (!trimmed) return;

  history.unshift(trimmed);
  historyIdx = -1;
  printInput(trimmed);

  var parts = trimmed.split(' ');
  var cmd = parts[0].toLowerCase();
  var args = parts.slice(1);

  // Special cases
  if (trimmed.toLowerCase() === 'sudo rm -rf /' || trimmed.toLowerCase() === 'sudo rm -rf /*') {
    print(COMMANDS['sudo rm -rf /']());
    return;
  }

  if (cmd === 'roll') {
    print(handleRoll(args));
    return;
  }

  if (COMMANDS[cmd]) {
    print(COMMANDS[cmd]());
  } else {
    print([
      ['err', '  command not found: ' + cmd],
      ['out', '  type "help" to see available commands'],
      ['blank', ''],
    ]);
  }
}

// Boot sequence
function boot() {
  BOOT.forEach(function(line) {
    var div = document.createElement('div');
    div.className = 'line ascii';
    div.textContent = line;
    output.appendChild(div);
  });
}

// Input handling
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var val = input.value;
    input.value = '';
    handleCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < history.length - 1) {
      historyIdx++;
      input.value = history[historyIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      input.value = history[historyIdx];
    } else {
      historyIdx = -1;
      input.value = '';
    }
  }
});

// Always keep input focused
document.addEventListener('click', function() { input.focus(); });
document.addEventListener('keydown', function() { input.focus(); });

boot();
input.focus();
</script>
</body>
</html>
