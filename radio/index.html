<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEAS Radio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0b'/%3E%3Ctext x='16' y='22' font-family='Arial Black,sans-serif' font-size='11' font-weight='900' fill='%23c8f04a' text-anchor='middle'%3EWEAS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0b; --bg2: #111113; --bg3: #18181c;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
      --text: #f0ede8; --text-muted: #6b6b72; --text-mid: #9a9aa3;
      --accent: #c8f04a; --red: #ff5c5c; --orange: #ff9f4a;
      --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; opacity: 0.4;
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 3rem; border-bottom: 1px solid var(--border);
      background: rgba(10,10,11,0.85); backdrop-filter: blur(12px);
    }
    .nav-logo { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); letter-spacing: 0.05em; text-decoration: none; }
    .nav-back { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--accent); }

    main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 3rem; }

    /* STATION HEADER */
    .station-header {
      text-align: center; margin-bottom: 3rem;
      animation: fadeUp 0.5s ease forwards;
    }

    .station-logo {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800; letter-spacing: -0.03em;
      color: var(--accent); line-height: 1;
      text-shadow: 0 0 40px rgba(200,240,74,0.3);
      margin-bottom: 0.5rem;
    }

    .station-tagline {
      font-family: var(--font-mono); font-size: 0.82rem;
      color: var(--text-muted); letter-spacing: 0.1em;
    }

    .on-air {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--red); letter-spacing: 0.15em; text-transform: uppercase;
      border: 1px solid var(--red); padding: 0.3rem 0.8rem;
      border-radius: 100px; margin-top: 0.75rem;
      background: rgba(255,92,92,0.08);
    }

    .on-air-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 6px var(--red);
      animation: pulse 1s ease-in-out infinite;
    }

    /* NOW PLAYING */
    .now-playing-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 2.5rem;
      margin-bottom: 1.5rem; position: relative; overflow: hidden;
      animation: fadeUp 0.5s ease forwards 0.1s; opacity: 0;
    }

    .now-playing-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.1s linear;
    }

    .track-type-badge {
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 3px;
      display: inline-block; margin-bottom: 1rem;
    }

    .badge-song { background: rgba(200,240,74,0.1); color: var(--accent); border: 1px solid rgba(200,240,74,0.2); }
    .badge-jingle { background: rgba(92,184,255,0.1); color: #5cb8ff; border: 1px solid rgba(92,184,255,0.2); }
    .badge-commercial { background: rgba(255,159,74,0.1); color: var(--orange); border: 1px solid rgba(255,159,74,0.2); }

    .track-title {
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem;
      transition: opacity 0.3s;
    }

    .track-artist {
      font-family: var(--font-mono); font-size: 0.88rem;
      color: var(--text-muted); margin-bottom: 1.5rem;
      transition: opacity 0.3s;
    }

    /* PROGRESS BAR */
    .progress-container { margin-bottom: 1.5rem; }
    .progress-bar {
      height: 4px; background: var(--bg3); border-radius: 100px;
      overflow: hidden; margin-bottom: 0.5rem; cursor: pointer;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 100px;
      width: 0%; transition: width 0.5s linear;
    }
    .progress-times {
      display: flex; justify-content: space-between;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
    }

    /* CONTROLS */
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 1.25rem;
    }

    .ctrl-btn {
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer;
      color: var(--text-muted); transition: all 0.2s; border-radius: 50%;
      width: 44px; height: 44px; font-size: 1.1rem;
    }
    .ctrl-btn:hover { color: var(--accent); background: rgba(200,240,74,0.08); }

    .play-pause-btn {
      width: 56px; height: 56px; font-size: 1.4rem;
      background: var(--accent); color: #0a0a0b;
      border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .play-pause-btn:hover { transform: scale(1.05); background: #d4f55a; }

    .volume-row {
      display: flex; align-items: center; gap: 0.75rem;
      margin-top: 1.5rem; justify-content: center;
    }
    .volume-icon { font-size: 0.9rem; color: var(--text-muted); }
    input[type="range"].volume {
      accent-color: var(--accent); width: 120px; cursor: pointer;
    }

    /* UP NEXT */
    .up-next-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem;
      animation: fadeUp 0.5s ease forwards 0.2s; opacity: 0;
    }

    .up-next-header {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent);
      letter-spacing: 0.12em; text-transform: uppercase;
    }

    .queue-item {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-item:hover { background: var(--bg3); }

    .queue-num {
      font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--text-muted); width: 1.5rem; flex-shrink: 0;
    }

    .queue-info { flex: 1; min-width: 0; }
    .queue-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-artist { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }

    .queue-badge {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em;
      padding: 0.15rem 0.5rem; border-radius: 3px; flex-shrink: 0;
    }

    /* PLAYLIST SECTION */
    .section-label {
      display: flex; align-items: center; gap: 1rem;
      font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    .section-label::after { content: ''; flex: 1; max-width: 80px; height: 1px; background: var(--border-hover); }

    .playlist-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
      background: var(--border); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; margin-bottom: 2rem;
      animation: fadeUp 0.5s ease forwards 0.3s; opacity: 0;
    }

    .playlist-item {
      background: var(--bg2); padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 0.75rem;
      transition: background 0.2s; cursor: pointer;
    }
    .playlist-item:hover { background: var(--bg3); }
    .playlist-item.playing { background: rgba(200,240,74,0.05); }

    .pl-icon { font-size: 0.9rem; flex-shrink: 0; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-sub { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
    .pl-type { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); flex-shrink: 0; }

    /* LOADING STATE */
    .loading-state {
      text-align: center; padding: 3rem;
      font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      main { padding: 1.5rem; }
      .playlist-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">thatonedudeaust.com</a>
  <a href="/" class="nav-back">← Back to home</a>
</nav>

<main>

  <!-- STATION HEADER -->
  <div class="station-header">
    <div class="station-logo">WEAS</div>
    <div class="station-tagline">your station — playing 24/7</div>
    <div class="on-air"><div class="on-air-dot"></div> ON AIR</div>
  </div>

  <!-- NOW PLAYING -->
  <div class="now-playing-card" id="now-playing-card">
    <div class="loading-state" id="loading-state">Loading station...</div>
    <div id="player-ui" style="display:none">
      <span class="track-type-badge badge-song" id="track-badge">Song</span>
      <div class="track-title" id="track-title">—</div>
      <div class="track-artist" id="track-artist">—</div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="skipTrack()" title="Skip">⏭</button>
        <button class="play-pause-btn" id="play-pause-btn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="toggleMute()" title="Mute" id="mute-btn">🔊</button>
      </div>

      <div class="volume-row">
        <span class="volume-icon">🔈</span>
        <input type="range" class="volume" id="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)" />
        <span class="volume-icon">🔊</span>
      </div>
    </div>
  </div>

  <!-- UP NEXT -->
  <div class="up-next-card" id="up-next-card" style="display:none">
    <div class="up-next-header">Up Next</div>
    <div id="queue-list"></div>
  </div>

  <!-- PLAYLIST -->
  <div id="playlist-section" style="display:none">
    <div class="section-label">Full Playlist</div>
    <div class="playlist-grid" id="playlist-grid"></div>
  </div>

</main>

<audio id="audio-player" preload="auto"></audio>

<script>
  var SUPABASE_URL = 'https://rwsythvgrelvkldszdac.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_H1x2cBYCi86dKVynWe96oA_zUQKw1x3';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var audio = document.getElementById('audio-player');
  var playlist = [];
  var jingles = [];
  var commercials = [];
  var queue = [];
  var currentIdx = 0;
  var songsSinceBreak = 0;
  var nextBreakAt = randomBetween(2, 4);
  var isPlaying = false;

  function randomBetween(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  // Convert Google Drive share link to direct stream URL
  function driveToStream(url) {
    var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match) return 'https://drive.google.com/uc?export=download&id=' + match[1];
    var idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch) return 'https://drive.google.com/uc?export=download&id=' + idMatch[1];
    return url;
  }

  async function loadStation() {
    var { data: songs } = await sb.from('radio_songs').select('*').eq('active', true).order('created_at');
    var { data: jingleData } = await sb.from('radio_jingles').select('*').eq('active', true);
    var { data: commercialData } = await sb.from('radio_commercials').select('*').eq('active', true);

    playlist = songs || [];
    jingles = jingleData || [];
    commercials = commercialData || [];

    if (playlist.length === 0) {
      document.getElementById('loading-state').textContent = 'No tracks loaded yet. Add some in the admin panel!';
      return;
    }

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('player-ui').style.display = 'block';
    document.getElementById('up-next-card').style.display = 'block';
    document.getElementById('playlist-section').style.display = 'block';

    buildQueue();
    renderPlaylist();
    loadTrack(0);
  }

  function buildQueue() {
    // Shuffle playlist
    var shuffled = playlist.slice().sort(function() { return Math.random() - 0.5; });
    queue = [];
    songsSinceBreak = 0;
    nextBreakAt = randomBetween(2, 4);

    shuffled.forEach(function(song) {
      queue.push({ type: 'song', data: song });
      songsSinceBreak++;
      if (songsSinceBreak >= nextBreakAt) {
        // Insert jingle or commercial
        if (jingles.length > 0 && Math.random() > 0.4) {
          var j = jingles[Math.floor(Math.random() * jingles.length)];
          queue.push({ type: 'jingle', data: j });
        }
        if (commercials.length > 0 && Math.random() > 0.5) {
          var c = commercials[Math.floor(Math.random() * commercials.length)];
          queue.push({ type: 'commercial', data: c });
        }
        songsSinceBreak = 0;
        nextBreakAt = randomBetween(2, 4);
      }
    });
  }

  function loadTrack(idx) {
    if (idx >= queue.length) {
      // Rebuild queue and loop
      buildQueue();
      idx = 0;
    }

    currentIdx = idx;
    var item = queue[idx];
    if (!item) return;

    var url = driveToStream(item.data.url);
    audio.src = url;
    audio.volume = parseFloat(document.getElementById('volume-slider').value);

    // Update UI
    var badges = { song: 'badge-song', jingle: 'badge-jingle', commercial: 'badge-commercial' };
    var badgeLabels = { song: 'Song', jingle: 'Station ID', commercial: 'Commercial' };
    var badge = document.getElementById('track-badge');
    badge.className = 'track-type-badge ' + (badges[item.type] || 'badge-song');
    badge.textContent = badgeLabels[item.type] || 'Song';

    document.getElementById('track-title').textContent = item.data.title;
    document.getElementById('track-artist').textContent = item.data.artist || (item.type === 'jingle' ? 'WEAS Station ID' : item.type === 'commercial' ? 'Commercial' : '');

    // Reset progress
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('time-current').textContent = '0:00';
    document.getElementById('time-total').textContent = '0:00';
    document.getElementById('now-playing-card').querySelector('::before');

    renderQueue();
    highlightPlaylistItem(idx);

    if (isPlaying) {
      audio.play().catch(function() {});
      document.getElementById('play-pause-btn').textContent = '⏸';
    }
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play().then(function() {
        isPlaying = true;
        document.getElementById('play-pause-btn').textContent = '⏸';
      }).catch(function() {});
    } else {
      audio.pause();
      isPlaying = false;
      document.getElementById('play-pause-btn').textContent = '▶';
    }
  }

  function skipTrack() {
    loadTrack(currentIdx + 1);
    if (isPlaying) audio.play().catch(function() {});
  }

  function setVolume(val) {
    audio.volume = parseFloat(val);
    audio.muted = false;
    document.getElementById('mute-btn').textContent = '🔊';
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    document.getElementById('mute-btn').textContent = audio.muted ? '🔇' : '🔊';
  }

  // Progress bar
  audio.addEventListener('timeupdate', function() {
    if (!audio.duration) return;
    var pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', function() {
    loadTrack(currentIdx + 1);
    if (isPlaying) audio.play().catch(function() {});
  });

  audio.addEventListener('play', function() {
    isPlaying = true;
    document.getElementById('play-pause-btn').textContent = '⏸';
  });

  audio.addEventListener('pause', function() {
    isPlaying = false;
    document.getElementById('play-pause-btn').textContent = '▶';
  });

  function formatTime(secs) {
    if (isNaN(secs)) return '0:00';
    var m = Math.floor(secs / 60);
    var s = Math.floor(secs % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function renderQueue() {
    var list = document.getElementById('queue-list');
    var next = queue.slice(currentIdx + 1, currentIdx + 5);
    if (next.length === 0) { list.innerHTML = '<div style="padding:1rem 1.5rem;font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted)">End of queue — will loop!</div>'; return; }
    var badgeColors = { song: 'color:var(--accent)', jingle: 'color:#5cb8ff', commercial: 'color:var(--orange)' };
    var badgeLabels = { song: 'song', jingle: 'id', commercial: 'ad' };
    list.innerHTML = next.map(function(item, i) {
      return '<div class="queue-item">' +
        '<div class="queue-num">' + (i + 1) + '</div>' +
        '<div class="queue-info">' +
          '<div class="queue-title">' + item.data.title + '</div>' +
          '<div class="queue-artist">' + (item.data.artist || '') + '</div>' +
        '</div>' +
        '<div class="queue-badge" style="' + (badgeColors[item.type] || '') + '">' + (badgeLabels[item.type] || '') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderPlaylist() {
    var grid = document.getElementById('playlist-grid');
    var icons = { song: '🎵', jingle: '📻', commercial: '📢' };
    grid.innerHTML = queue.map(function(item, i) {
      return '<div class="playlist-item" id="pl-' + i + '" onclick="jumpTo(' + i + ')">' +
        '<div class="pl-icon">' + (icons[item.type] || '🎵') + '</div>' +
        '<div class="pl-info">' +
          '<div class="pl-title">' + item.data.title + '</div>' +
          '<div class="pl-sub">' + (item.data.artist || item.type) + '</div>' +
        '</div>' +
        '<div class="pl-type">' + formatTime(item.data.duration || 0) + '</div>' +
      '</div>';
    }).join('');
  }

  function highlightPlaylistItem(idx) {
    document.querySelectorAll('.playlist-item').forEach(function(el) { el.classList.remove('playing'); });
    var el = document.getElementById('pl-' + idx);
    if (el) { el.classList.add('playing'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  function jumpTo(idx) {
    loadTrack(idx);
    isPlaying = true;
    audio.play().catch(function() {});
  }

  loadStation();
</script>
</body>
</html>
